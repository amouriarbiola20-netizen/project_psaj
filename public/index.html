<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jadwal Pelajaran Harian Siswa — SMK Telkom Purwokerto</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --board: #0b0b0d;
    --board-soft: #161113;
    --board-line: #3a1414;
    --chalk: #f5f2ee;
    --chalk-dim: #c9beb8;
    --red: #e8232b;
    --red-deep: #9c0f18;
    --red-glow: rgba(232, 35, 43, 0.35);
    --white: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--board);
    background-image:
      radial-gradient(ellipse at top left, rgba(232,35,43,0.10), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(255,255,255,0.035), transparent 55%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.012) 0 2px, transparent 2px 26px);
    font-family: 'Inter', sans-serif;
    color: var(--chalk);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .frame {
    width: 100%;
    max-width: 720px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 28px 20px 20px;
  }

  /* garis aksen merah-putih di paling atas biar ada identitas warna sejak awal */
  .frame::before {
    content: '';
    display: block;
    height: 4px;
    width: 100%;
    border-radius: 4px;
    margin-bottom: 22px;
    background: repeating-linear-gradient(
      90deg,
      var(--red) 0 26px,
      var(--white) 26px 40px,
      #111 40px 46px
    );
    box-shadow: 0 0 16px var(--red-glow);
  }

  header {
    text-align: center;
    margin-bottom: 18px;
  }

  .logo-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 10px;
  }

  .logo-wrap img {
    height: 64px;
    width: auto;
    filter: drop-shadow(0 0 14px var(--red-glow));
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    opacity: 0.9;
  }

  h1 {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 40px;
    line-height: 1.15;
    margin: 6px 0 4px;
    position: relative;
    display: inline-block;
    background: linear-gradient(90deg, var(--red) 0%, var(--white) 45%, var(--red) 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 6s linear infinite;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  h1::after {
    content: '';
    position: absolute;
    left: 4%;
    right: 4%;
    bottom: -4px;
    height: 3px;
    background-image: repeating-linear-gradient(
      90deg, var(--red) 0 10px, var(--white) 10px 14px, transparent 14px 20px
    );
    opacity: 0.85;
    border-radius: 2px;
  }

  h2.school {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.03em;
    margin: 8px 0 2px;
    color: var(--white);
  }

  h2.school span {
    color: var(--red);
  }

  .subtitle {
    font-size: 13px;
    color: var(--chalk-dim);
    margin-top: 4px;
  }

  .chat-panel {
    flex: 1;
    background: var(--board-soft);
    border: 1px solid var(--board-line);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 45px -20px rgba(156,15,24,0.35), 0 0 0 1px rgba(255,255,255,0.02) inset;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 380px;
    max-height: 58vh;
  }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    animation: appear 0.25s ease-out;
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .row.user .bubble {
    background: rgba(232, 35, 43, 0.14);
    border: 1px dashed rgba(232, 35, 43, 0.6);
    color: var(--white);
    border-radius: 10px 10px 2px 10px;
  }

  .row.bot .bubble {
    background: none;
    border: none;
    border-left: 2px solid var(--red);
    padding-left: 14px;
    color: var(--chalk);
  }

  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 4px;
    opacity: 0.75;
  }

  .row.user .label { color: var(--red); text-align: right; }
  .row.bot .label { color: var(--chalk-dim); }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding-left: 14px;
  }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--red);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .input-tray {
    border-top: 1px solid var(--board-line);
    padding: 14px 16px;
    display: flex;
    gap: 10px;
    background: rgba(0,0,0,0.25);
  }

  #pesan {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--board-line);
    border-radius: 8px;
    padding: 11px 14px;
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
  }

  #pesan:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px var(--red-glow);
  }

  #pesan::placeholder { color: #8a7d78; }

  button {
    background: linear-gradient(90deg, var(--red-deep), var(--red));
    color: var(--white);
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: filter 0.15s, transform 0.15s;
  }
  button:hover { filter: brightness(1.12); transform: translateY(-1px); }
  button:disabled { opacity: 0.5; cursor: default; transform: none; }

  .hints {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--chalk-dim);
    border: 1px dashed var(--board-line);
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
    background: transparent;
    transition: border-color 0.15s, color 0.15s;
  }
  .hint:hover {
    border-color: var(--red);
    color: var(--white);
    background: rgba(232,35,43,0.12);
  }

  footer.foot-note {
    text-align: center;
    margin-top: 16px;
    font-size: 11px;
    color: var(--chalk-dim);
    opacity: 0.7;
    letter-spacing: 0.04em;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--board-line); border-radius: 8px; }
</style>
</head>
<body>
  <div class="frame">
    <header>
      <div class="logo-wrap">
        <!-- Ganti "logo-smk.png" sesuai nama file logo yang kamu upload ke folder public/ -->
        <img src="/LOGO.jpg" alt="Logo SMK Telkom Purwokerto" />
      </div>
      <div class="eyebrow">Asisten Jadwal · AI</div>
      <h1>Jadwal Pelajaran Harian Siswa</h1>
      <h2 class="school">SMK <span>Telkom</span> Purwokerto</h2>
      <div class="subtitle">Tulis di kolom bawah, aku catat di papan.</div>
    </header>

    <div class="chat-panel">
      <div class="messages" id="messages"></div>
      <div class="input-tray">
        <input id="pesan" type="text" placeholder="Contoh: tambahin jadwal les matematika besok jam 4 sore" autocomplete="off" />
        <button id="kirim">Kirim</button>
      </div>
    </div>

    <div class="hints">
      <button class="hint" data-msg="jadwal aku hari ini apa aja?">jadwal hari ini?</button>
      <button class="hint" data-msg="jadwal aku minggu ini apa aja?">jadwal minggu ini?</button>
      <button class="hint" data-msg="tambahin jadwal piket kelas besok jam 7 pagi">+ tambah jadwal</button>
    </div>

    <footer class="foot-note">SMK Telkom Purwokerto · Papan Jadwal Digital</footer>
  </div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('pesan');
  const kirimBtn = document.getElementById('kirim');

  function tambahBubble(teks, pengirim) {
    const row = document.createElement('div');
    row.className = 'row ' + pengirim;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = pengirim === 'user' ? 'kamu' : 'asisten';
    bubble.appendChild(label);
    const isi = document.createElement('span');
    isi.textContent = teks;
    bubble.appendChild(isi);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function tampilkanTyping() {
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typing-row';
    row.innerHTML = '<div class="bubble"><span class="label">asisten</span><span class="typing"><span></span><span></span><span></span></span></div>';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hapusTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  async function kirimPesan(teks) {
    if (!teks.trim()) return;
    tambahBubble(teks, 'user');
    inputEl.value = '';
    kirimBtn.disabled = true;
    tampilkanTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pesan: teks }),
      });
      const data = await res.json();
      hapusTyping();
      tambahBubble(data.balasan || 'Maaf, tidak ada balasan.', 'bot');
    } catch (err) {
      hapusTyping();
      tambahBubble('Maaf, gagal terhubung ke server. Coba lagi ya.', 'bot');
    } finally {
      kirimBtn.disabled = false;
      inputEl.focus();
    }
  }

  kirimBtn.addEventListener('click', () => kirimPesan(inputEl.value));
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') kirimPesan(inputEl.value);
  });
  document.querySelectorAll('.hint').forEach((btn) => {
    btn.addEventListener('click', () => kirimPesan(btn.dataset.msg));
  });

  tambahBubble('Halo! Aku bisa bantu catat, ubah, atau cek jadwal kamu. Coba tulis sesuatu, atau klik salah satu contoh di bawah ✏️', 'bot');
</script>
</body>
</html>
