<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Papan Jadwal — Asisten AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --board: #1e2a22;
    --board-soft: #24352a;
    --board-line: #3c4e40;
    --chalk: #f4f1e8;
    --chalk-dim: #c9cfc4;
    --chalk-yellow: #e8c468;
    --chalk-blue: #8fb8b0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--board);
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.03), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(255,255,255,0.025), transparent 55%);
    font-family: 'Inter', sans-serif;
    color: var(--chalk);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .frame {
    width: 100%;
    max-width: 720px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 28px 20px 20px;
  }

  header {
    text-align: center;
    margin-bottom: 18px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--chalk-blue);
    opacity: 0.85;
  }

  h1 {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 48px;
    margin: 4px 0 6px;
    color: var(--chalk);
    position: relative;
    display: inline-block;
  }

  h1::after {
    content: '';
    position: absolute;
    left: 4%;
    right: 4%;
    bottom: -4px;
    height: 3px;
    background-image: repeating-linear-gradient(
      90deg, var(--chalk-yellow) 0 10px, transparent 10px 16px
    );
    opacity: 0.8;
    border-radius: 2px;
  }

  .subtitle {
    font-size: 13.5px;
    color: var(--chalk-dim);
  }

  .chat-panel {
    flex: 1;
    background: var(--board-soft);
    border: 1px solid var(--board-line);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.5);
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 380px;
    max-height: 58vh;
  }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    animation: appear 0.25s ease-out;
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .row.user .bubble {
    background: rgba(232, 196, 104, 0.12);
    border: 1px dashed rgba(232, 196, 104, 0.55);
    color: var(--chalk-yellow);
    border-radius: 10px 10px 2px 10px;
  }

  .row.bot .bubble {
    background: none;
    border: none;
    border-left: 2px solid var(--chalk-blue);
    padding-left: 14px;
    color: var(--chalk);
  }

  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 4px;
    opacity: 0.7;
  }

  .row.user .label { color: var(--chalk-yellow); text-align: right; }
  .row.bot .label { color: var(--chalk-blue); }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding-left: 14px;
  }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--chalk-blue);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .input-tray {
    border-top: 1px solid var(--board-line);
    padding: 14px 16px;
    display: flex;
    gap: 10px;
    background: rgba(0,0,0,0.12);
  }

  #pesan {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--board-line);
    border-radius: 8px;
    padding: 11px 14px;
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
  }

  #pesan:focus {
    border-color: var(--chalk-blue);
  }

  #pesan::placeholder { color: #7c8a80; }

  button {
    background: var(--chalk-yellow);
    color: #24301f;
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: filter 0.15s;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: default; }

  .hints {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--chalk-dim);
    border: 1px dashed var(--board-line);
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
    background: transparent;
    transition: border-color 0.15s, color 0.15s;
  }
  .hint:hover {
    border-color: var(--chalk-blue);
    color: var(--chalk-blue);
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--board-line); border-radius: 8px; }
</style>
</head>
<body>
  <div class="frame">
    <header>
      <div class="eyebrow">Asisten Jadwal · AI</div>
      <h1>Papan Jadwal</h1>
      <div class="subtitle">Tulis di kolom bawah, aku catat di papan.</div>
    </header>

    <div class="chat-panel">
      <div class="messages" id="messages"></div>
      <div class="input-tray">
        <input id="pesan" type="text" placeholder="Contoh: tambahin jadwal les matematika besok jam 4 sore" autocomplete="off" />
        <button id="kirim">Kirim</button>
      </div>
    </div>

    <div class="hints">
      <button class="hint" data-msg="jadwal aku hari ini apa aja?">jadwal hari ini?</button>
      <button class="hint" data-msg="jadwal aku minggu ini apa aja?">jadwal minggu ini?</button>
      <button class="hint" data-msg="tambahin jadwal piket kelas besok jam 7 pagi">+ tambah jadwal</button>
    </div>
  </div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('pesan');
  const kirimBtn = document.getElementById('kirim');

  function tambahBubble(teks, pengirim) {
    const row = document.createElement('div');
    row.className = 'row ' + pengirim;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = pengirim === 'user' ? 'kamu' : 'asisten';
    bubble.appendChild(label);
    const isi = document.createElement('span');
    isi.textContent = teks;
    bubble.appendChild(isi);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function tampilkanTyping() {
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typing-row';
    row.innerHTML = '<div class="bubble"><span class="label">asisten</span><span class="typing"><span></span><span></span><span></span></span></div>';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hapusTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  async function kirimPesan(teks) {
    if (!teks.trim()) return;
    tambahBubble(teks, 'user');
    inputEl.value = '';
    kirimBtn.disabled = true;
    tampilkanTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pesan: teks }),
      });
      const data = await res.json();
      hapusTyping();
      tambahBubble(data.balasan || 'Maaf, tidak ada balasan.', 'bot');
    } catch (err) {
      hapusTyping();
      tambahBubble('Maaf, gagal terhubung ke server. Coba lagi ya.', 'bot');
    } finally {
      kirimBtn.disabled = false;
      inputEl.focus();
    }
  }

  kirimBtn.addEventListener('click', () => kirimPesan(inputEl.value));
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') kirimPesan(inputEl.value);
  });
  document.querySelectorAll('.hint').forEach((btn) => {
    btn.addEventListener('click', () => kirimPesan(btn.dataset.msg));
  });

  tambahBubble('Halo! Aku bisa bantu catat, ubah, atau cek jadwal kamu. Coba tulis sesuatu, atau klik salah satu contoh di bawah ✏️', 'bot');
</script>
</body>
</html>
