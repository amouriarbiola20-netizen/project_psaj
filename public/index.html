<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jadwal Pelajaran Harian Siswa — SMK Telkom Purwokerto (Kelas 12 TJKT 1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --red: #E30613;
    --red-deep: #A8040F;
    --red-glow: rgba(227, 6, 19, 0.25);
    --ink: #1A1A1E;
    --ink-soft: #5B5B63;
    --paper: #FFFFFF;
    --paper-soft: #F5F5F7;
    --line: #E7E6E8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background-image:
      linear-gradient(180deg, rgba(20,4,6,0.82) 0%, rgba(20,4,6,0.90) 100%),
      url('/hero-sekolah.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .frame {
    width: 100%;
    max-width: 720px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    box-shadow: 0 0 40px rgba(0,0,0,0.06);
  }

  /* ===== Top bar: logo + nama sekolah, seperti navbar web resmi ===== */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 3px solid var(--red);
  }

  .topbar img {
    height: 40px;
    width: auto;
  }

  .topbar .school-name {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    line-height: 1.2;
    color: var(--ink);
  }

  .topbar .school-name span {
    color: var(--red);
  }

  .topbar .school-sub {
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  /* ===== Hero: foto gedung sekolah + judul, seperti header web resmi ===== */
  .hero {
    position: relative;
    height: 230px;
    background-image:
      linear-gradient(180deg, rgba(20,4,6,0.35) 0%, rgba(20,4,6,0.78) 100%),
      url('/hero-sekolah.jpg');
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 22px 20px;
  }

  .hero .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #FFD9DB;
    margin-bottom: 6px;
  }

  .hero h1 {
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 28px;
    line-height: 1.15;
    margin: 0 0 6px;
    color: var(--paper);
  }

  .hero .subtitle {
    font-size: 13px;
    color: #F1E3E4;
  }

  .hero .kelas-tag {
    display: inline-block;
    margin-top: 10px;
    align-self: flex-start;
    background: var(--red);
    color: var(--paper);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
  }

  /* ===== Chat panel ===== */
  .chat-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 340px;
    max-height: 52vh;
    background-color: var(--paper-soft);
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNzAiIGhlaWdodD0iMTcwIj4KICA8dGV4dCB4PSI2IiB5PSIzNCIgZm9udC1zaXplPSIyNiIgb3BhY2l0eT0iMC4xMCI+8J+TmjwvdGV4dD4KICA8dGV4dCB4PSI5NiIgeT0iNTgiIGZvbnQtc2l6ZT0iMjAiIG9wYWNpdHk9IjAuMTAiPuKcj++4jzwvdGV4dD4KICA8dGV4dCB4PSIzNiIgeT0iMTA0IiBmb250LXNpemU9IjIyIiBvcGFjaXR5PSIwLjEwIj7wn46TPC90ZXh0PgogIDx0ZXh0IHg9IjExOCIgeT0iMTMyIiBmb250LXNpemU9IjE4IiBvcGFjaXR5PSIwLjEwIj7wn5OQPC90ZXh0PgogIDx0ZXh0IHg9IjEwIiB5PSIxNTYiIGZvbnQtc2l6ZT0iMjAiIG9wYWNpdHk9IjAuMTAiPvCfj6s8L3RleHQ+Cjwvc3ZnPg==");
    background-repeat: repeat;
    background-size: 170px 170px;
  }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    animation: appear 0.25s ease-out;
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .row.user .bubble {
    background: var(--red);
    color: var(--paper);
    border-radius: 12px 12px 2px 12px;
    box-shadow: 0 6px 14px -6px var(--red-glow);
  }

  .row.bot .bubble {
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 2px 12px 12px 12px;
  }

  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 4px;
    opacity: 0.75;
  }

  .row.user .label { color: #FFE3E4; text-align: right; }
  .row.bot .label { color: var(--ink-soft); }

  .typing {
    display: inline-flex;
    gap: 4px;
  }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--red);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .input-tray {
    border-top: 1px solid var(--line);
    padding: 14px 16px;
    display: flex;
    gap: 10px;
    background: var(--paper);
  }

  #pesan {
    flex: 1;
    background: var(--paper-soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 11px 14px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
  }

  #pesan:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px var(--red-glow);
  }

  #pesan::placeholder { color: #A6A3A6; }

  button {
    background: linear-gradient(90deg, var(--red-deep), var(--red));
    color: var(--paper);
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: filter 0.15s, transform 0.15s;
  }
  button:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button:disabled { opacity: 0.5; cursor: default; transform: none; }

  .hints {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 14px 20px 4px;
    background: var(--paper);
  }
  .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
    background: var(--paper-soft);
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .hint:hover {
    border-color: var(--red);
    color: var(--red-deep);
    background: rgba(227,6,19,0.06);
  }

  footer.foot-note {
    text-align: center;
    padding: 14px 20px 20px;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    background: var(--paper);
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
</style>
</head>
<body>
  <div class="frame">
    <div class="topbar">
      <!-- Ganti "logo-smk.png" sesuai nama file logo yang kamu upload ke folder public/ -->
      <img src="/logo-smk.png" alt="Logo SMK Telkom Purwokerto" />
      <div>
        <div class="school-name">SMK <span>Telkom</span> Purwokerto</div>
        <div class="school-sub">Asisten Jadwal · AI</div>
      </div>
    </div>

    <div class="hero">
      <div class="eyebrow">Papan Jadwal Digital</div>
      <h1>Jadwal Pelajaran Harian Siswa</h1>
      <div class="subtitle">Tulis di kolom bawah, aku catat di papan.</div>
      <div class="kelas-tag">Kelas 12 TJKT 1</div>
    </div>

    <div class="chat-panel">
      <div class="messages" id="messages"></div>
     <div class="hints">
       <button class="hint" data-msg="jadwal aku hari ini apa aja?">jadwal hari ini?</button>
       <button class="hint" data-msg="jadwal aku minggu ini apa aja?">jadwal minggu ini?</button>
       <button class="hint" data-fill="true" data-msg="tambahin jadwal [nama kegiatan] [besok/tanggal] jam [waktu]">+ tambah jadwal</button>
     </div>
      <div class="input-tray">
        <input id="pesan" type="text" placeholder="Contoh: tambahin jadwal les matematika besok jam 4 sore" autocomplete="off" />
        <button id="kirim">Kirim</button>
      </div>
    </div>

    <footer class="foot-note">SMK Telkom Purwokerto · Papan Jadwal Digital</footer>
  </div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('pesan');
  const kirimBtn = document.getElementById('kirim');

  function tambahBubble(teks, pengirim) {
    const row = document.createElement('div');
    row.className = 'row ' + pengirim;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = pengirim === 'user' ? 'kamu' : 'asisten';
    bubble.appendChild(label);
    const isi = document.createElement('span');
    isi.textContent = teks;
    bubble.appendChild(isi);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function tampilkanTyping() {
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typing-row';
    row.innerHTML = '<div class="bubble"><span class="label">asisten</span><span class="typing"><span></span><span></span><span></span></span></div>';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hapusTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  async function kirimPesan(teks) {
    if (!teks.trim()) return;
    tambahBubble(teks, 'user');
    inputEl.value = '';
    kirimBtn.disabled = true;
    tampilkanTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pesan: teks }),
      });
      const data = await res.json();
      hapusTyping();
      tambahBubble(data.balasan || 'Maaf, tidak ada balasan.', 'bot');
    } catch (err) {
      hapusTyping();
      tambahBubble('Maaf, gagal terhubung ke server. Coba lagi ya.', 'bot');
    } finally {
      kirimBtn.disabled = false;
      inputEl.focus();
    }
  }

  kirimBtn.addEventListener('click', () => kirimPesan(inputEl.value));
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') kirimPesan(inputEl.value);
  });

  // Tombol contoh: kalau data-fill="true", cuma isi kolom teks (biar bisa diedit
  // dulu sebelum dikirim). Kalau tidak ada atribut itu, langsung kirim seperti biasa.
  document.querySelectorAll('.hint').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (btn.dataset.fill === 'true') {
        inputEl.value = btn.dataset.msg;
        inputEl.focus();
        inputEl.setSelectionRange(0, inputEl.value.length);
      } else {
        kirimPesan(btn.dataset.msg);
      }
    });
  });

  tambahBubble('Halo! Aku bisa bantu catat, ubah, atau cek jadwal kamu. Coba tulis sesuatu, atau klik salah satu contoh di bawah ✏️', 'bot');
</script>
</body>
</html>
