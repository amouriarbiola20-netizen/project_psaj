  }

  .auth-btn {
    font-family: 'Inter', sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--paper-soft);
    color: var(--ink-soft);
    cursor: pointer;

  .auth-btn:hover { border-color: var(--red); color: var(--red-deep); }

    background: var(--paper);

  .auth-badge button:hover { border-color: var(--red); color: var(--red-deep); }

  .login-box {

  .login-box h3 {

    font-size: 17px;
    color: var(--ink);

    font-size: 12px;
    color: var(--ink-soft);
  }
  .login-box input {

    padding: 10px 12px;
    margin-bottom: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    outline: none;
    background: var(--paper-soft);

  .login-box input:focus { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-glow); }
  .login-actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;

  .login-actions button { flex: 1; }
  .btn-secondary {

    color: var(--ink-soft) !important;
    border: 1px solid var(--line);
  }
  .login-error {
    margin-top: 10px;
    font-size: 12px;
    color: var(--red-deep);

    color: #FFD9DB;

  .hero h1 {

    font-weight: 800;
    font-size: 28px;
    line-height: 1.15;
    margin: 0 0 6px;
    color: var(--paper);

  .hero .subtitle {

    color: #F1E3E4;
  }

  .hero .kelas-tag {
    display: inline-block;
    margin-top: 10px;
    align-self: flex-start;
    background: var(--red);
    color: var(--paper);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
